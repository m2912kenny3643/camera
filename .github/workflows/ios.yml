name: Build iPhone IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.0
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks
      - name: Inspect public hardware capture API
        run: |
          set -euo pipefail
          mkdir -p build
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          find "$sdk/System/Library/Frameworks/AVKit.framework/Headers" -name '*CaptureEvent*.h' -exec cat {} + | tee build/capture-event-api.log
      - name: Install project generator
        run: brew install xcodegen
      - name: Download bundled offline subject model
        run: python3 scripts/prepare_model.py
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Test tracking, geometry and presets
        run: |
          set -euo pipefail
          mkdir -p build
          swift test 2>&1 | tee build/core-tests.log
          python3 scripts/test_packaging.py
      - name: Archive unsigned iPhone app
        run: |
          set -euo pipefail
          xcodebuild archive -project R6Camera.xcodeproj -scheme R6Camera \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/R6Camera.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build/archive.log
          python3 scripts/package_ipa.py build/R6Camera.xcarchive build/R6Camera-unsigned.ipa
      - name: Upload IPA for re-signing
        uses: actions/upload-artifact@v4
        with:
          name: R6Camera-unsigned-IPA
          path: |
            build/R6Camera-unsigned.ipa
            build/model-provenance.json
          if-no-files-found: error
      - name: Test fixed landscape and secondary menus
        timeout-minutes: 12
        run: |
          set -euo pipefail
          xcodebuild test -project R6Camera.xcodeproj -scheme R6Camera \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -only-testing:R6CameraUITests -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 180 \
            -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/ui-tests.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build/*.log
            build/*.xcresult
          if-no-files-found: ignore
      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d build/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/screenshots || true
          fi
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UI-screenshots
          path: build/screenshots
          if-no-files-found: ignore
