name: Build iPhone IPA

on:
  push:
    branches: [main, codex/r6-0.4]
    paths-ignore:
      - 'docs/**'
      - 'scripts/research_*.py'
      - '.github/workflows/bird-research.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.0
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks
      - name: Inspect public hardware capture API
        run: |
          set -euo pipefail
          mkdir -p build
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          find "$sdk/System/Library/Frameworks/AVKit.framework/Headers" -name '*CaptureEvent*.h' -exec cat {} + | tee build/capture-event-api.log
      - name: Install project generator
        run: brew install xcodegen
      - name: Download bundled offline subject model
        run: python3 scripts/prepare_model.py
      - name: Check optional bird model distribution gate
        run: |
          set -euo pipefail
          python3 scripts/check_bird_functional_release.py
          echo '0.7 functional test: pinned Android ONNX bundled. Formal 100-image and phone qualification pending.' >> "$GITHUB_STEP_SUMMARY"
          cp LICENSE R6Camera/Resources/APP-LICENSE.txt
          git rev-parse HEAD > R6Camera/Resources/SOURCE-COMMIT.txt
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Test tracking, geometry and presets
        run: |
          set -euo pipefail
          mkdir -p build
          swift test 2>&1 | tee build/core-tests.log
          python3 scripts/test_packaging.py
          python3 scripts/test_bird_release.py
          python3 scripts/test_bird_functional_release.py
          python3 scripts/test_simulator.py
          python3 scripts/test_bird_eval_metrics.py
      - name: Archive unsigned iPhone app
        run: |
          set -euo pipefail
          xcodebuild archive -project R6Camera.xcodeproj -scheme R6Camera \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/R6Camera.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build/archive.log
          python3 scripts/package_ipa.py build/R6Camera.xcarchive build/R6Camera-unsigned.ipa
          python3 scripts/check_bird_functional_release.py build/R6Camera-unsigned.ipa
      - name: Boot dedicated iPhone simulator
        timeout-minutes: 7
        run: python3 scripts/prepare_simulator.py
      - name: Test fixed landscape and secondary menus
        timeout-minutes: 12
        run: |
          set -euo pipefail
          xcodebuild test -project R6Camera.xcodeproj -scheme R6Camera \
            -destination "platform=iOS Simulator,id=$R6_SIMULATOR_UDID" \
            -only-testing:R6CameraTests -only-testing:R6CameraUITests -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 240 \
            -maximum-test-execution-time-allowance 240 \
            -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/ui-tests.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build/*.log
            build/*.xcresult
          if-no-files-found: ignore
      - name: Export UI screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          container=$(xcrun simctl get_app_container "$R6_SIMULATOR_UDID" com.kenny.camera.R6CameraUITests.xctrunner data 2>/dev/null || true)
          if [ -n "$container" ] && [ -d "$container/tmp/R6CameraScreenshots" ]; then
            cp "$container/tmp/R6CameraScreenshots/"*.png build/screenshots/ || true
          fi
          if [ -d build/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/screenshots || true
          fi
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UI-screenshots
          path: build/screenshots
          if-no-files-found: ignore
      - name: Upload validation IPA after tests
        uses: actions/upload-artifact@v4
        with:
          name: R6Camera-0.8-focus-areas-IPA
          path: |
            build/R6Camera-unsigned.ipa
            build/model-provenance.json
            docs/bird-functional-release.json
            docs/research/android-bird-0.7.md
          if-no-files-found: error
