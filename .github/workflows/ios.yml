name: Build iPhone IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.0
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks
      - name: Install project generator
        run: brew install xcodegen
      - name: Download bundled offline subject model
        run: python3 scripts/prepare_model.py
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Test tracking, geometry and presets
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild test -project R6Camera.xcodeproj -scheme R6Camera \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -parallel-testing-enabled NO -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/tests.log
      - name: Archive unsigned iPhone app
        run: |
          set -euo pipefail
          xcodebuild archive -project R6Camera.xcodeproj -scheme R6Camera \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/R6Camera.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build/archive.log
          python3 scripts/package_ipa.py build/R6Camera.xcarchive build/R6Camera-unsigned.ipa
      - name: Upload IPA for re-signing
        uses: actions/upload-artifact@v4
        with:
          name: R6Camera-unsigned-IPA
          path: |
            build/R6Camera-unsigned.ipa
            build/model-provenance.json
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build/*.log
            build/*.xcresult
          if-no-files-found: ignore
