name: Personal bird pose conversion research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-and-convert:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned research tools
        run: |
          python -m pip install torch==2.7.0 torchvision==0.22.0 ultralytics==8.4.67 coremltools==9.0 numpy==1.26.4 opencv-python==4.11.0.86
      - name: Restricted checkpoint conversion and synthetic parity
        env:
          R6_BIRD_PERSONAL_RESEARCH: "1"
        run: python scripts/research_bird_export.py --convert
      - name: Upload descriptors and metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bird-research-report
          path: build/bird-research.log
          if-no-files-found: ignore
