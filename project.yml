name: R6Camera
options:
  bundleIdPrefix: com.kenny.camera
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: "0.9.2"
    CURRENT_PROJECT_VERSION: "13"
packages:
  OnnxRuntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: 1.24.2
targets:
  R6Camera:
    type: application
    platform: iOS
    dependencies:
      - package: OnnxRuntime
        product: onnxruntime
    sources:
      - path: R6Camera
        excludes: [Info.plist, Resources/BirdEyePose.onnx, Resources/BIRD-MODEL-CARD.md, Resources/BIRD-FIXTURE-SOURCES.json, Resources/LICENSE-ULTRALYTICS.txt, Resources/LICENSE-ONNXRUNTIME.txt, Resources/THIRD-PARTY-ONNXRUNTIME.txt]
      - path: R6Camera/Resources/BirdEyePose.onnx
        buildPhase: resources
      - path: R6Camera/Resources/BIRD-MODEL-CARD.md
        buildPhase: resources
      - path: R6Camera/Resources/BIRD-FIXTURE-SOURCES.json
        buildPhase: resources
      - path: R6Camera/Resources/LICENSE-ULTRALYTICS.txt
        buildPhase: resources
      - path: R6Camera/Resources/LICENSE-ONNXRUNTIME.txt
        buildPhase: resources
      - path: R6Camera/Resources/THIRD-PARTY-ONNXRUNTIME.txt
        buildPhase: resources
    info:
      path: R6Camera/Info.plist
      properties:
        CFBundleDisplayName: R6 Camera
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: 使用相機拍攝照片、識別主體並持續對焦。
        NSPhotoLibraryAddUsageDescription: 將你拍攝的照片儲存到相簿。
        NSMotionUsageDescription: 使用裝置方向感測器顯示電子水平儀。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kenny.camera.r6
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
  R6CameraTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: R6Camera
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  R6CameraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: R6Camera
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  R6Camera:
    build:
      targets:
        R6Camera: all
    test:
      targets: [R6CameraTests, R6CameraUITests]
